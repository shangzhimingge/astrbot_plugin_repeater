# AstrBot 插件元数据（v4 规范）
# 插件名（与仓库名一致，推荐 astrbot_plugin_ 开头、小写、无空格）
name: astrbot_plugin_repeater
# 插件描述（插件市场卡片展示）
desc: 群复读机：当群内连续 N 个不同的人发送相同消息时，机器人自动跟一条。支持按群开关、自定义触发人数与冷却时间，适配 NapCatQQ（OneBot v11 / aiocqhttp）。
# 作者
author: yosers
# 版本号
version: 1.1.1
# 仓库地址
repo: https://github.com/yoser-s/astrbot_plugin_repeater
# 插件展示名（可选）
display_name: 群复读机
# 插件市场卡片上的短描述（可选，未提供时回退显示 desc）
short_desc: 群内连续 N 人刷屏相同消息时，机器人自动跟一条
# 开源许可（可选）
license: MIT
# 声明支持的平台适配器（NapCatQQ 使用 OneBot v11，对应 aiocqhttp）
support_platforms:
  - aiocqhttp
# 声明兼容的 AstrBot 版本范围（PEP 440，不加 v 前缀）
astrbot_version: ">=4.16,<5"
